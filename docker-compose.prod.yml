services:

  nginx:
    build: ./compose/production/nginx
    image: rbzk_pro_nginx
    volumes:
      - staticfiles:/rbzk/staticfiles
      - mediafiles:/rbzk/mediafiles
    ports:
      - 80:80
      - 443:443
    depends_on:
      - web
      - flower
    networks:
      - rbzk_network


  websocket-service:
    build: ./wbskt_srvs
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - WEBSOCKET_HEALTH_PORT=8080
      - DJANGO_SETTINGS_MODULE=rbzk.settings
      - PYTHONPATH=/rbzk_pro
    volumes:
      - .:/rbzk_pro
    working_dir: /rbzk_pro/wbskt_srvs
    env_file:
      - ./environment/.prod
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rbzk_network
    deploy:
      resources:
        limits:
          memory: 512M

      
  web:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    command: /start
    image: rbzk_pro_web
    ports:
      - "8000:8000" 
    volumes:
      - staticfiles:/rbzk/staticfiles
      - mediafiles:/rbzk/mediafiles
      - .:/rbzk_pro
    env_file:
      - ./environment/.prod
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
      websocket-service:
        condition: service_started
    networks:
      - rbzk_network
    deploy:
      resources:
        limits:
          memory: 1G


  db:
    image: postgres:15-alpine
    volumes:
      - ./postgresData:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=hello_django
      - POSTGRES_USER=hello_django
      - POSTGRES_PASSWORD=hello_django
    networks:
      - rbzk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_django -d hello_django"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rbzk_network
    deploy:
      resources:
        limits:
          memory: 768M


  rabbitmq:
    image: rabbitmq:3-management
    env_file:
      - ./environment/.prod
    networks:
      - rbzk_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M


  celery_worker_default:
    restart: always
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: rbzk_pro_celery_worker_default
    command: /start-default-celeryworker
    volumes:
      - staticfiles:/rbzk/staticfiles
      - mediafiles:/rbzk/mediafiles
    env_file:
      - ./environment/.prod
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - rbzk_network
    deploy:
      resources:
        limits:
          memory: 1G


  celery_worker_high:
    restart: always
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: rbzk_pro_celery_worker_high
    command: /start-high-celeryworker
    volumes:
      - staticfiles:/rbzk/staticfiles
      - mediafiles:/rbzk/mediafiles
    env_file:
      - ./environment/.prod
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - rbzk_network
    deploy:
      resources:
        limits:
          memory: 1G

  celery_beat:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: rbzk_pro_celery_beat
    command: /start-celerybeat
    volumes:
      - staticfiles:/rbzk/staticfiles
      - mediafiles:/rbzk/mediafiles
    env_file:
      - ./environment/.prod
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rbzk_network
    deploy:
      resources:
        limits:
          memory: 512M


  flower:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: rbzk_pro_celery_flower
    command: /start-flower
    volumes:
      - staticfiles:/rbzk/staticfiles
      - mediafiles:/rbzk/mediafiles
      - flower_db:/app/flower_db
    env_file:
      - ./environment/.prod
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rbzk_network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  rbzk_network:
    driver: bridge


volumes:
  postgresData:
  redis_data:
  flower_db:
  staticfiles:
  mediafiles:
