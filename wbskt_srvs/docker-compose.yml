version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  websocket-service:
    build: ./websocket_service
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PRODUCT_IDS=BTC-USD,ETH-USD
      - WEBSOCKET_HEALTH_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  django-app:
    build: ./django_app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - WEBSOCKET_SERVICE_URL=http://websocket-service:8080
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      websocket-service:
        condition: service_started
    volumes:
      - ./django_app:/app
    networks:
      - app_network

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge