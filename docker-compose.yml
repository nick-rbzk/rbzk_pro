services:
  websocket-service:
    build: ./wbskt_srvs
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - WEBSOCKET_HEALTH_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rbzk_network


  web:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: rbzk_pro_web
    # '/start' is the shell script used to run the service
    command: /start.sh
    # this volume is used to map the files and folders on the host to the container
    # so if we change code on the host, code in the docker container will also be changed
    volumes:
      - .:/rbzk_pro
    ports:
      - 8010:8000
    # env_file is used to manage the env variables of our project
    env_file:
      - ./environment/.dev
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
      websocket-service:
        condition: service_started
    networks:
      - rbzk_network


  db:
    image: postgres:15-alpine
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=hello_django
      - POSTGRES_USER=hello_django
      - POSTGRES_PASSWORD=hello_django
    networks:
      - rbzk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_django -d hello_django"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rbzk_network


  rabbitmq:
    image: rabbitmq:3-management
    env_file:
      - ./environment/.dev
    networks:
      - rbzk_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  celery_worker_default:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: rbzk_pro_celery_worker_default
    command: /start-default-celeryworker.sh
    volumes:
      - .:/rbzk_pro
    env_file:
      - ./environment/.dev
    depends_on:
      - redis
      - db
    networks:
      - rbzk_network


  celery_worker_high:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: rbzk_pro_celery_worker_high
    command: /start-high-celeryworker.sh
    volumes:
      - .:/rbzk_pro
    env_file:
      - ./environment/.dev
    depends_on:
      - redis
      - db
    networks:
      - rbzk_network


  celery_beat:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: rbzk_pro_celery_beat
    command: /start-celerybeat.sh
    volumes:
      - .:/rbzk_pro
    env_file:
      - ./environment/.dev
    depends_on:
      - redis
      - db
    networks:
      - rbzk_network


  flower:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: rbzk_pro_celery_flower
    command: /start-flower.sh
    volumes:
      - .:/rbzk_pro
    env_file:
      - ./environment/.dev
    ports:
      - 5557:5555
    depends_on:
      - redis
      - db
    networks:
      - rbzk_network

networks:
  rbzk_network:
    driver: bridge


volumes:
  postgres_data:
  redis_data: